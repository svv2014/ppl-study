name: QA build + test

# Runs only when a PR is labeled `ready-for-qa` — avoids burning CI on WIP pushes.
# On success: applies `qa-pass` (which triggers auto-merge).
# On failure: applies `qa-fail` and comments with a link to the run.

on:
  pull_request:
    types: [labeled]

permissions:
  pull-requests: write
  contents: read

jobs:
  qa:
    if: github.event.label.name == 'ready-for-qa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-app/package-lock.json

      - name: Install
        working-directory: web-app
        run: npm ci

      - name: Build
        working-directory: web-app
        run: npm run build

      - name: Test (if present)
        working-directory: web-app
        run: npm test --if-present

      - name: Apply qa-pass
        if: success()
        env:
          # Use AUTOMERGE_PAT so the label change triggers auto-merge workflow
          # (GITHUB_TOKEN-driven label changes don't trigger other workflows).
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label ready-for-qa \
            --add-label qa-pass

      - name: Apply qa-fail
        if: failure()
        env:
          # Use AUTOMERGE_PAT so the label change triggers auto-merge workflow
          # (GITHUB_TOKEN-driven label changes don't trigger other workflows).
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label ready-for-qa \
            --add-label qa-fail
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "QA build/test failed. See [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
